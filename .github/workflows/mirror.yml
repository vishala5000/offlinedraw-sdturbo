name: mirror-model-pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Download EVERY file from Hugging Face and verify hashes
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.24"
          python3 - <<'PY'
          import os, json, hashlib, shutil
          from huggingface_hub import snapshot_download
          root = snapshot_download("frankdu/SD-Turbo-LiteRT", local_dir="model",
                                   max_workers=4, ignore_patterns=["__pycache__/*"])
          os.makedirs("pack_flat", exist_ok=True)
          used, n = set(), 0
          for dp, dns, fns in os.walk(root):
              dns[:] = [d for d in dns if d not in ("__pycache__", ".cache", ".git")]
              for fn in sorted(fns):
                  src = os.path.join(dp, fn)
                  rel = os.path.relpath(src, root).replace(os.sep, "/")
                  if rel.startswith(".cache/"):
                      continue
                  name = fn if (rel.startswith("graphs/") or "/" not in rel) else rel.replace("/", "__")
                  if name in used:
                      name = rel.replace("/", "__")
                  used.add(name)
                  dst = os.path.join("pack_flat", name)
                  try:
                      os.link(src, dst)
                  except OSError:
                      shutil.copyfile(src, dst)
                  n += 1
          man = json.load(open(os.path.join(root, "manifest.json")))
          lines, bad = [], []
          for rel, spec in sorted(man["files"].items()):
              p = os.path.join(root, rel)
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(8 << 20), b""):
                      h.update(chunk)
              lines.append("%s  %s" % (h.hexdigest(), rel))
              if h.hexdigest() != spec["sha256"] or os.path.getsize(p) != spec["bytes"]:
                  bad.append(rel)
          open("pack_flat/MODEL_PACK_SHA256SUMS.txt", "w").write("\n".join(lines) + "\n")
          print("staged:", n, "verified:", len(lines) - len(bad), "bad:", bad)
          if bad:
              raise SystemExit("hash verification failed")
          PY
          du -sh model pack_flat
          df -h /

      - name: Publish every file as release assets (tag model-pack)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-pack
          name: SD-Turbo-LiteRT - full model pack (all files)
          body: |
            Complete mirror of https://huggingface.co/frankdu/SD-Turbo-LiteRT
            Every file is a separate release asset (git rejects files > 100 MB).
            Graph names are unchanged: copy *.tflite into /sdcard/OfflineDraw/bundle/graphs/
            for a fully offline install, or let the app download them from here.
          files: pack_flat/*
          overwrite_files: true
          fail_on_unmatched_files: true
